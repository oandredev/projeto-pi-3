<div class="library-wrapper">
  <div class="library-header">
    <h2>Minha Biblioteca <span class="arrow-title">&gt;</span></h2>
  </div>

  <div *ngIf="offers.length === 0" class="empty-state">
    <p>Você ainda não possui nenhum jogo.</p>
    <a href="/offers" class="btn-offers">Ver Ofertas</a>
  </div>

  <div class="library-grid" *ngIf="offers.length > 0">
    <div *ngFor="let offer of offers" class="offer-card" (click)="goToDetails(offer.id)">
      <div class="image-container">
        <img [src]="offer.imageUrl" [alt]="'Imagem da ' + offer.name" class="offer-image" />
      </div>
      <div class="card-content">
        <span class="game-type">Jogo base</span>
        <h3>{{ offer.name }}</h3>
        <p class="price">R$ {{ offer.priceBase | number: '1.2-2' }}</p>
        <button class="details-button">Ver Detalhes</button>
      </div>
    </div>
  </div>
</div>
